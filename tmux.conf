##### 前缀键 #####
unbind C-b                     # 取消默认前缀 Ctrl+b
set -g prefix C-a              # 设置前缀为 Ctrl+a
bind C-a send-prefix           # 在 tmux 内发送 Ctrl+a

##### 基础体验 #####
set -g mouse on                # 开启鼠标支持（点击切 pane、滚动历史）
set -g history-limit 100000    # 历史记录增加到 10 万行
set -g default-terminal "screen-256color" # 启用 256 色
setw -g mode-keys vi           # 复制模式使用 vim 键位

##### 分屏 #####
unbind '"' ; unbind %          # 取消默认分屏快捷键
bind | split-window -h         # prefix + | 左右分屏
bind - split-window -v         # prefix + - 上下分屏

##### pane 切换 #####
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Alt + 方向键切换 pane（无需 prefix）

bind h select-pane -L ; bind j select-pane -D
bind k select-pane -U ; bind l select-pane -R
# prefix + hjkl vim 风格切换 pane

##### pane 大小调整 #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# prefix + HJKL 调整 pane 大小

bind m resize-pane -Z          # prefix + m 最大化当前 pane

##### 窗口 #####
bind c new-window -c "#{pane_current_path}" # 新窗口继承当前路径
set -g allow-rename off        # 禁止程序自动重命名窗口

##### 重新加载配置 #####
bind r source-file ~/.tmux.conf \; display "tmux 已重新加载"

##### 状态栏（酷炫深色主题） #####
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e fg=#cdd6f4"

set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#89b4fa,bold] #S "
# 左侧显示 session 名称

setw -g window-status-format " #[fg=#6c7086]#I:#W "
# 普通窗口颜色

setw -g window-status-current-format "#[fg=#f38ba8,bold]#I:#W "
# 当前窗口高亮

set -g status-right "#[fg=#a6e3a1]%H:%M #[fg=#f9e2af]%Y-%m-%d"
# 右侧显示时间和日期

##### pane 边框 #####
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

##### 提示信息样式 #####
set -g message-style "bg=#1e1e2e,fg=#f38ba8"
